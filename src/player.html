<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FilmBox Player</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Inter', sans-serif;
        background: #000;
        color: #fff;
        height: 100vh;
        overflow: hidden;
        user-select: none;
      }

      /* ── LOADING / ERROR SCREENS ── */
      #loading-screen, #error-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #050505;
        z-index: 100;
      }

      #error-screen { display: none; }

      #loading-screen i, #error-screen i {
        font-size: 48px;
        color: #71717a;
      }

      #loading-screen i { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      #loading-screen p, #error-screen p {
        color: #71717a;
        font-size: 16px;
      }

      #error-screen i { color: #f87171; }
      #error-screen p { color: #f87171; }

      #error-screen button {
        margin-top: 8px;
        padding: 12px 24px;
        border-radius: 14px;
        border: none;
        background: #27272a;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
      }
      #error-screen button:hover { background: #3f3f46; }

      /* ── PLAYER ── */
      #player-wrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
        cursor: none;
      }

      #player-wrap.controls-visible { cursor: default; }

      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      /* ── TOP BAR ── */
      .player-topbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 24px 32px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
        display: flex;
        align-items: center;
        gap: 20px;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 10;
      }

      #player-back {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
        white-space: nowrap;
      }
      #player-back:hover { background: rgba(255,255,255,0.16); }

      #player-title {
        font-size: 17px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── QUALITY SELECTOR ── */
      #quality-selector {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(18,18,20,0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        padding: 32px;
        min-width: 340px;
        z-index: 20;
        display: none;
      }

      #quality-selector h3 {
        font-size: 18px;
        margin-bottom: 20px;
        text-align: center;
      }

      .quality-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .quality-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border-radius: 14px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.07);
        cursor: pointer;
        transition: 0.2s;
        font-size: 14px;
      }
      .quality-item:hover { background: rgba(255,255,255,0.1); }
      .quality-item span:last-child { color: #71717a; font-size: 12px; }

      /* ── CENTER PLAY INDICATOR ── */
      #center-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.6);
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        opacity: 0;
        transition: opacity 0.15s ease, transform 0.15s ease;
        pointer-events: none;
        z-index: 5;
      }

      #center-indicator.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      /* ── BOTTOM CONTROLS ── */
      .player-controls {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 60px 32px 28px;
        background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 10;
      }

      /* show controls on hover state */
      #player-wrap.controls-visible .player-topbar,
      #player-wrap.controls-visible .player-controls {
        opacity: 1;
      }

      /* ── SEEK BAR ── */
      .seek-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
      }

      .seek-bar-wrap {
        flex: 1;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.2);
        position: relative;
        cursor: pointer;
        transition: height 0.15s ease;
      }

      .seek-bar-wrap:hover { height: 6px; }

      #seek-filled {
        height: 100%;
        border-radius: 999px;
        background: #fff;
        pointer-events: none;
        position: relative;
      }

      #seek-filled::after {
        content: '';
        position: absolute;
        right: -6px;
        top: 50%;
        transform: translateY(-50%) scale(0);
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s ease;
      }

      .seek-bar-wrap:hover #seek-filled::after { transform: translateY(-50%) scale(1); }

      .time-label {
        font-size: 13px;
        color: rgba(255,255,255,0.75);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      /* ── CONTROLS ROW ── */
      .controls-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .controls-left, .controls-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .ctrl-btn {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        border: none;
        background: transparent;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
      }
      .ctrl-btn:hover { background: rgba(255,255,255,0.1); }

      #play-pause-btn { font-size: 22px; }

      /* ── VOLUME ── */
      .volume-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      #volume-slider {
        -webkit-appearance: none;
        width: 80px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.25);
        outline: none;
        cursor: pointer;
      }

      #volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
      }

      /* ── SPEED SELECTOR ── */
      .speed-wrap {
        position: relative;
      }

      #speed-btn {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        min-width: 52px;
      }

      .speed-menu {
        position: absolute;
        bottom: 52px;
        right: 0;
        background: rgba(18,18,20,0.97);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 14px;
        overflow: hidden;
        display: none;
        flex-direction: column;
        min-width: 100px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      }

      .speed-menu.open { display: flex; }

      .speed-option {
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s;
        text-align: center;
        color: rgba(255,255,255,0.75);
      }

      .speed-option:hover { background: rgba(255,255,255,0.08); }
      .speed-option.active { color: #fff; font-weight: 600; }
    </style>
  </head>
  <body>

    <div id="loading-screen">
      <i class="bi bi-arrow-repeat"></i>
      <p>Načítání přehrávače...</p>
    </div>

    <div id="error-screen">
      <i class="bi bi-exclamation-circle"></i>
      <p id="error-msg">Něco se pokazilo.</p>
      <button onclick="history.back()"><i class="bi bi-arrow-left"></i> Zpět</button>
    </div>

    <div id="player-wrap" style="display:none">

      <video id="video" preload="metadata"></video>

      <!-- top bar -->
      <div class="player-topbar">
        <button id="player-back" onclick="history.back()">
          <i class="bi bi-arrow-left"></i> Zpět
        </button>
        <span id="player-title"></span>
      </div>

      <!-- quality picker (shown when multiple sources) -->
      <div id="quality-selector">
        <h3>Vyberte zdroj</h3>
        <div class="quality-list" id="quality-list"></div>
      </div>

      <!-- center play/pause feedback -->
      <div id="center-indicator"><i class="bi bi-play-fill" id="center-icon"></i></div>

      <!-- bottom controls -->
      <div class="player-controls">
        <div class="seek-row">
          <span class="time-label" id="time-current">0:00</span>
          <div class="seek-bar-wrap" id="seek-bar">
            <div id="seek-filled" style="width:0%"></div>
          </div>
          <span class="time-label" id="time-total">0:00</span>
        </div>

        <div class="controls-row">
          <div class="controls-left">
            <button class="ctrl-btn" id="play-pause-btn"><i class="bi bi-play-fill"></i></button>
            <div class="volume-wrap">
              <button class="ctrl-btn" id="mute-btn"><i class="bi bi-volume-up-fill"></i></button>
              <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" />
            </div>
          </div>
          <div class="controls-right">
            <div class="speed-wrap">
              <button class="ctrl-btn" id="speed-btn">1×</button>
              <div class="speed-menu" id="speed-menu">
                <div class="speed-option" data-speed="0.5">0.5×</div>
                <div class="speed-option active" data-speed="1">1×</div>
                <div class="speed-option" data-speed="1.25">1.25×</div>
                <div class="speed-option" data-speed="1.5">1.5×</div>
                <div class="speed-option" data-speed="2">2×</div>
              </div>
            </div>
            <button class="ctrl-btn" id="pip-btn" title="Picture in Picture"><i class="bi bi-pip"></i></button>
            <button class="ctrl-btn" id="fullscreen-btn"><i class="bi bi-fullscreen"></i></button>
          </div>
        </div>
      </div>

    </div>

    <script>
      const video        = document.getElementById('video')
      const playerWrap   = document.getElementById('player-wrap')
      const loadingScreen = document.getElementById('loading-screen')
      const errorScreen  = document.getElementById('error-screen')
      const errorMsg     = document.getElementById('error-msg')
      const playerTitle  = document.getElementById('player-title')
      const playPauseBtn = document.getElementById('play-pause-btn')
      const muteBtn      = document.getElementById('mute-btn')
      const volumeSlider = document.getElementById('volume-slider')
      const fullscreenBtn= document.getElementById('fullscreen-btn')
      const seekBar      = document.getElementById('seek-bar')
      const seekFilled   = document.getElementById('seek-filled')
      const timeCurrent  = document.getElementById('time-current')
      const timeTotal    = document.getElementById('time-total')
      const centerIndicator = document.getElementById('center-indicator')
      const centerIcon   = document.getElementById('center-icon')
      const qualitySelector = document.getElementById('quality-selector')
      const qualityList  = document.getElementById('quality-list')
      const speedBtn     = document.getElementById('speed-btn')
      const speedMenu    = document.getElementById('speed-menu')
      const pipBtn       = document.getElementById('pip-btn')

      // ── Load data from sessionStorage ──
      function _profileId() {
        try {
          const r = sessionStorage.getItem('filmbox_active_profile')
          return r ? (JSON.parse(r).id || 'default') : 'default'
        } catch { return 'default' }
      }

      const raw = sessionStorage.getItem('filmbox_player')
      let playerKey = ''

      if (!raw) {
        showError('Žádná data přehrávače. Vraťte se zpět a vyberte video.')
      } else {
        const data = JSON.parse(raw)
        playerTitle.textContent = data.title || 'FilmBox'
        document.title = (data.title || 'FilmBox') + ' — Player'
        playerKey = data.tmdbId
          ? 'filmbox_progress_' + _profileId() + '_' + data.tmdbId
          : 'filmbox_progress_' + _profileId() + '_' + (data.title || 'unknown').replace(/\s+/g, '_')

        if (data.tmdbId) {
          localStorage.setItem('filmbox_meta_' + data.tmdbId, JSON.stringify({
            id:          data.tmdbId,
            title:       data.title,
            media_type:  data.mediaType || 'movie',
            mediaType:   data.mediaType || 'movie',
            poster_path: data.posterPath || null
          }))
        }

        if (data.videos.length === 1) {
          startVideo(data.videos[0])
        } else {
          showQualityPicker(data.videos)
        }
      }

      // ── Restore volume from localStorage ──
      const savedVol = localStorage.getItem('filmbox_volume')
      if (savedVol !== null) {
        video.volume = parseFloat(savedVol)
        volumeSlider.value = video.volume
      }

      function showError(msg) {
        loadingScreen.style.display = 'none'
        errorMsg.textContent = msg
        errorScreen.style.display = 'flex'
      }

      function showQualityPicker(videos) {
        loadingScreen.style.display = 'none'
        playerWrap.style.display = 'block'
        qualitySelector.style.display = 'block'

        videos.forEach((v, i) => {
          const item = document.createElement('div')
          item.className = 'quality-item'
          item.innerHTML = `
            <span>${v.name || 'Zdroj ' + (i + 1)}</span>
            <span>${v.duration || ''}</span>
          `
          item.addEventListener('click', () => {
            qualitySelector.style.display = 'none'
            startVideo(v)
          })
          qualityList.appendChild(item)
        })
      }

      function startVideo(v) {
        loadingScreen.style.display = 'none'
        playerWrap.style.display = 'block'
        video.src = v.videoSrc
        video.play().catch(() => {})
      }

      // ── Format time ──
      function fmt(s) {
        if (isNaN(s)) return '0:00'
        const m = Math.floor(s / 60)
        const sec = Math.floor(s % 60)
        return `${m}:${sec.toString().padStart(2, '0')}`
      }

      // ── Video events ──
      video.addEventListener('loadedmetadata', () => {
        timeTotal.textContent = fmt(video.duration)
        // Restore saved progress for this title
        if (playerKey) {
          const saved = parseFloat(localStorage.getItem(playerKey))
          if (saved && saved > 0 && saved < video.duration - 5) {
            video.currentTime = saved
          }
        }
      })

      let progressSaveTimer = null
      let _watchedFired = false
      video.addEventListener('timeupdate', () => {
        if (!video.duration) return
        const pct = (video.currentTime / video.duration) * 100
        seekFilled.style.width = pct + '%'
        timeCurrent.textContent = fmt(video.currentTime)
        // Save progress every 5s
        clearTimeout(progressSaveTimer)
        progressSaveTimer = setTimeout(() => {
          if (playerKey) localStorage.setItem(playerKey, video.currentTime)
        }, 5000)
        // Auto-mark watched at 90%
        if (!_watchedFired && video.currentTime / video.duration >= 0.9) {
          _watchedFired = true
          const _raw = sessionStorage.getItem('filmbox_player')
          if (_raw) {
            const _d = JSON.parse(_raw)
            if (_d.tmdbId) {
              const _wKey  = 'filmbox_watched_' + _profileId()
              const _wList = JSON.parse(localStorage.getItem(_wKey) || '[]')
              if (!_wList.some(w => w.id === _d.tmdbId)) {
                _wList.unshift({
                  id:         _d.tmdbId,
                  mediaType:  _d.mediaType || 'movie',
                  title:      _d.title,
                  posterPath: _d.posterPath || null,
                  watchedAt:  new Date().toISOString()
                })
                localStorage.setItem(_wKey, JSON.stringify(_wList))
              }
            }
          }
        }
      })

      video.addEventListener('play', () => {
        playPauseBtn.innerHTML = '<i class="bi bi-pause-fill"></i>'
      })

      video.addEventListener('pause', () => {
        playPauseBtn.innerHTML = '<i class="bi bi-play-fill"></i>'
      })

      video.addEventListener('ended', () => {
        playPauseBtn.innerHTML = '<i class="bi bi-arrow-counterclockwise"></i>'
      })

      video.addEventListener('error', () => {
        showError('Video se nepodařilo načíst. Zkuste jiný zdroj.')
      })

      // ── Play / Pause ──
      function togglePlay() {
        if (video.ended) {
          video.currentTime = 0
          video.play()
          return
        }
        if (video.paused) {
          video.play()
          centerIcon.className = 'bi bi-play-fill'
        } else {
          video.pause()
          centerIcon.className = 'bi bi-pause-fill'
        }
        centerIndicator.classList.add('show')
        clearTimeout(centerIndicator._t)
        centerIndicator._t = setTimeout(() => centerIndicator.classList.remove('show'), 600)
      }

      playPauseBtn.addEventListener('click', togglePlay)
      video.addEventListener('click', togglePlay)

      // ── Seek ──
      let seeking = false

      function applySek(e) {
        const rect = seekBar.getBoundingClientRect()
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width))
        video.currentTime = pct * video.duration
      }

      seekBar.addEventListener('mousedown', e => { seeking = true; applySek(e) })
      document.addEventListener('mousemove', e => { if (seeking) applySek(e) })
      document.addEventListener('mouseup', () => { seeking = false })

      // ── Volume ──
      volumeSlider.addEventListener('input', () => {
        video.volume = volumeSlider.value
        video.muted = video.volume === 0
        localStorage.setItem('filmbox_volume', video.volume)
        updateMuteIcon()
      })

      muteBtn.addEventListener('click', () => {
        video.muted = !video.muted
        volumeSlider.value = video.muted ? 0 : video.volume
        updateMuteIcon()
      })

      function updateMuteIcon() {
        const v = video.muted || video.volume === 0
        muteBtn.innerHTML = v
          ? '<i class="bi bi-volume-mute-fill"></i>'
          : '<i class="bi bi-volume-up-fill"></i>'
      }

      // ── Fullscreen ──
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          playerWrap.requestFullscreen()
          fullscreenBtn.innerHTML = '<i class="bi bi-fullscreen-exit"></i>'
        } else {
          document.exitFullscreen()
          fullscreenBtn.innerHTML = '<i class="bi bi-fullscreen"></i>'
        }
      })

      // ── Playback speed ──
      speedBtn.addEventListener('click', e => {
        e.stopPropagation()
        speedMenu.classList.toggle('open')
      })

      speedMenu.querySelectorAll('.speed-option').forEach(opt => {
        opt.addEventListener('click', () => {
          const speed = parseFloat(opt.dataset.speed)
          video.playbackRate = speed
          speedBtn.textContent = speed === 1 ? '1×' : speed + '×'
          speedMenu.querySelectorAll('.speed-option').forEach(o => o.classList.remove('active'))
          opt.classList.add('active')
          speedMenu.classList.remove('open')
        })
      })

      document.addEventListener('click', e => {
        if (!e.target.closest('.speed-wrap')) speedMenu.classList.remove('open')
      })

      // ── Picture in Picture ──
      if (document.pictureInPictureEnabled) {
        pipBtn.addEventListener('click', async () => {
          if (document.pictureInPictureElement) {
            await document.exitPictureInPicture()
          } else {
            await video.requestPictureInPicture()
          }
        })
      } else {
        pipBtn.style.display = 'none'
      }

      // ── Keyboard shortcuts ──
      document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return
        if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay() }
        if (e.key === 'ArrowRight') video.currentTime = Math.min(video.duration, video.currentTime + 10)
        if (e.key === 'ArrowLeft')  video.currentTime = Math.max(0, video.currentTime - 10)
        if (e.key === 'ArrowUp')    { video.volume = Math.min(1, video.volume + 0.1); volumeSlider.value = video.volume; updateMuteIcon() }
        if (e.key === 'ArrowDown')  { video.volume = Math.max(0, video.volume - 0.1); volumeSlider.value = video.volume; updateMuteIcon() }
        if (e.key === 'f') fullscreenBtn.click()
        if (e.key === 'm') muteBtn.click()
      })

      // ── Auto-hide controls ──
      let hideTimeout
      function showControls() {
        playerWrap.classList.add('controls-visible')
        clearTimeout(hideTimeout)
        hideTimeout = setTimeout(() => {
          if (!video.paused) playerWrap.classList.remove('controls-visible')
        }, 3000)
      }

      playerWrap.addEventListener('mousemove', showControls)
      playerWrap.addEventListener('mouseenter', showControls)

      video.addEventListener('pause', () => {
        playerWrap.classList.add('controls-visible')
        clearTimeout(hideTimeout)
      })

      window.addEventListener('pagehide', () => {
        if (playerKey && video.currentTime > 5) {
          localStorage.setItem(playerKey, video.currentTime)
        }
      })
    </script>
  </body>
</html>
