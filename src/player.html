<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FilmBox Player</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Inter', sans-serif;
        background: #000;
        color: #fff;
        height: 100vh;
        overflow: hidden;
        user-select: none;
      }

      /* ── LOADING / ERROR SCREENS ── */
      #loading-screen, #error-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #050505;
        z-index: 100;
      }

      #error-screen { display: none; }

      #loading-screen i, #error-screen i {
        font-size: 48px;
        color: #71717a;
      }

      #loading-screen i { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      #loading-screen p, #error-screen p {
        color: #71717a;
        font-size: 16px;
      }

      #error-screen i { color: #f87171; }
      #error-screen p { color: #f87171; }

      #error-screen button {
        margin-top: 8px;
        padding: 12px 24px;
        border-radius: 14px;
        border: none;
        background: #27272a;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
      }
      #error-screen button:hover { background: #3f3f46; }

      /* ── PLAYER ── */
      #player-wrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
        cursor: none;
      }

      #player-wrap.controls-visible { cursor: default; }

      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      /* ── TOP BAR ── */
      .player-topbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 24px 32px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
        display: flex;
        align-items: center;
        gap: 20px;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 10;
      }

      #player-back {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
        white-space: nowrap;
      }
      #player-back:hover { background: rgba(255,255,255,0.16); }

      #player-title {
        font-size: 17px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── QUALITY SELECTOR ── */
      #quality-selector {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(18,18,20,0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        padding: 32px;
        min-width: 340px;
        z-index: 20;
        display: none;
      }

      #quality-selector h3 {
        font-size: 18px;
        margin-bottom: 20px;
        text-align: center;
      }

      .quality-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .quality-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border-radius: 14px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.07);
        cursor: pointer;
        transition: 0.2s;
        font-size: 14px;
      }
      .quality-item:hover { background: rgba(255,255,255,0.1); }
      .quality-item span:last-child { color: #71717a; font-size: 12px; }

      /* ── CENTER PLAY INDICATOR ── */
      #center-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.6);
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        opacity: 0;
        transition: opacity 0.15s ease, transform 0.15s ease;
        pointer-events: none;
        z-index: 5;
      }

      #center-indicator.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      /* ── BOTTOM CONTROLS ── */
      .player-controls {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 60px 32px 28px;
        background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 10;
      }

      /* show controls on hover state */
      #player-wrap.controls-visible .player-topbar,
      #player-wrap.controls-visible .player-controls {
        opacity: 1;
      }

      /* ── SEEK BAR ── */
      .seek-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
      }

      .seek-bar-wrap {
        flex: 1;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.2);
        position: relative;
        cursor: pointer;
        transition: height 0.15s ease;
      }

      .seek-bar-wrap:hover { height: 6px; }

      #seek-buffered {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        border-radius: 999px;
        background: rgba(255,255,255,0.3);
        pointer-events: none;
        z-index: 0;
      }

      #seek-filled {
        height: 100%;
        border-radius: 999px;
        background: #fff;
        pointer-events: none;
        position: relative;
        z-index: 1;
      }

      #speed-indicator {
        position: absolute;
        top: 90px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
        z-index: 6;
      }
      #speed-indicator.show { opacity: 1; }

      /* keyboard-shortcut help overlay */
      #shortcuts-help {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(6px);
      }
      #shortcuts-help.show { display: flex; }
      #shortcuts-help .sh-card {
        background: rgba(20,20,20,0.95);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 14px;
        padding: 24px 28px;
        max-width: 360px;
        width: calc(100% - 48px);
        color: #fff;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      }
      #shortcuts-help h3 {
        margin: 0 0 16px;
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #shortcuts-help dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px 16px;
        align-items: center;
      }
      #shortcuts-help dt { text-align: right; }
      #shortcuts-help dd { margin: 0; color: #cfcfcf; font-size: 14px; }
      #shortcuts-help kbd {
        display: inline-block;
        min-width: 20px;
        text-align: center;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.2);
        border-bottom-width: 2px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
      }
      #shortcuts-help .sh-hint {
        margin: 16px 0 0;
        font-size: 12px;
        color: #888;
        text-align: center;
      }
      #help-btn { font-size: 18px; }

      #seek-filled::after {
        content: '';
        position: absolute;
        right: -6px;
        top: 50%;
        transform: translateY(-50%) scale(0);
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s ease;
      }

      .seek-bar-wrap:hover #seek-filled::after { transform: translateY(-50%) scale(1); }

      .time-label {
        font-size: 13px;
        color: rgba(255,255,255,0.75);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      /* ── CONTROLS ROW ── */
      .controls-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .controls-left, .controls-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .ctrl-btn {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        border: none;
        background: transparent;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
      }
      .ctrl-btn:hover { background: rgba(255,255,255,0.1); }

      #play-pause-btn { font-size: 22px; }

      /* ── VOLUME ── */
      .volume-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      #volume-slider {
        -webkit-appearance: none;
        width: 80px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.25);
        outline: none;
        cursor: pointer;
      }

      #volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
      }

      /* ── SPEED SELECTOR ── */
      .speed-wrap {
        position: relative;
      }

      #speed-btn {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        min-width: 52px;
      }

      .speed-menu {
        position: absolute;
        bottom: 52px;
        right: 0;
        background: rgba(18,18,20,0.97);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 14px;
        overflow: hidden;
        display: none;
        flex-direction: column;
        min-width: 100px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      }

      .speed-menu.open { display: flex; }

      .speed-option {
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s;
        text-align: center;
        color: rgba(255,255,255,0.75);
      }

      .speed-option:hover { background: rgba(255,255,255,0.08); }
      .speed-option.active { color: #fff; font-weight: 600; }

      /* ── RESPONSIVE / PHONE ── */
      @media (max-width: 600px) {
        .player-controls { padding: 40px 16px 18px; }
        .player-topbar { padding: 16px; gap: 12px; }

        .ctrl-btn { width: 38px; height: 38px; font-size: 16px; }
        #play-pause-btn { font-size: 20px; }

        #player-back { padding: 9px 14px; font-size: 13px; }
        #player-title { font-size: 15px; }

        .controls-left, .controls-right { gap: 4px; }

        .seek-row { gap: 10px; margin-bottom: 10px; }
        .time-label { font-size: 12px; }

        #volume-slider { width: 56px; }

        #speed-btn { min-width: 46px; font-size: 12px; }
      }

      @media (max-width: 380px) {
        #volume-slider { display: none; }
        .controls-left, .controls-right { gap: 2px; }
        #player-title { font-size: 14px; }
        #player-back { padding: 8px 12px; }
      }

      @media (max-height: 500px) and (orientation: landscape) {
        .player-controls { padding: 32px 20px 12px; }
        .player-topbar { padding: 10px 16px; }
        .seek-row { margin-bottom: 8px; }
      }

      /* ── TOUCH NICETIES ── */
      @media (hover: none) and (pointer: coarse) {
        .ctrl-btn,
        #player-back,
        .quality-item,
        .speed-option {
          -webkit-tap-highlight-color: transparent;
          touch-action: manipulation;
        }
      }

      /* ── BUFFERING SPINNER ── */
      #buffer-spinner {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 52px;
        color: #fff;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        z-index: 6;
      }
      #buffer-spinner.show { opacity: 0.9; }
      #buffer-spinner i { display: inline-block; animation: buffer-spin 0.9s linear infinite; }
      @keyframes buffer-spin { to { transform: rotate(360deg); } }

      /* ── RESUME / NEXT-EPISODE PROMPTS ── */
      .resume-prompt, .next-ep-prompt {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(4px);
        z-index: 20;
        animation: prompt-fade 0.25s ease;
      }
      @keyframes prompt-fade { from { opacity: 0; } to { opacity: 1; } }
      .resume-card, .next-ep-card {
        background: #18181b;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 28px 32px;
        text-align: center;
        max-width: 90%;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }
      .resume-card p, .next-ep-card p { color: #fafafa; font-size: 17px; margin-bottom: 18px; }
      .resume-actions, .next-ep-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      .resume-yes, .next-ep-yes {
        background: #fafafa; color: #18181b; border: none;
        padding: 11px 20px; border-radius: 10px; font-weight: 700; font-size: 15px;
        cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .resume-no, .next-ep-no {
        background: transparent; color: #d4d4d8; border: 1px solid rgba(255,255,255,0.18);
        padding: 11px 20px; border-radius: 10px; font-weight: 600; font-size: 15px;
        cursor: pointer; transition: background 0.15s ease;
      }
      .resume-yes:hover, .next-ep-yes:hover { transform: translateY(-1px); }
      .resume-no:hover, .next-ep-no:hover { background: rgba(255,255,255,0.08); }
    </style>
  </head>
  <body>

    <div id="loading-screen">
      <i class="bi bi-arrow-repeat"></i>
      <p>Načítání přehrávače...</p>
    </div>

    <div id="error-screen">
      <i class="bi bi-exclamation-circle"></i>
      <p id="error-msg">Něco se pokazilo.</p>
      <button onclick="history.back()"><i class="bi bi-arrow-left"></i> Zpět</button>
    </div>

    <div id="player-wrap" style="display:none">

      <video id="video" preload="metadata"></video>

      <!-- top bar -->
      <div class="player-topbar">
        <button id="player-back" onclick="history.back()">
          <i class="bi bi-arrow-left"></i> Zpět
        </button>
        <span id="player-title"></span>
      </div>

      <!-- quality picker (shown when multiple sources) -->
      <div id="quality-selector">
        <h3>Vyberte zdroj</h3>
        <div class="quality-list" id="quality-list"></div>
      </div>

      <!-- buffering spinner -->
      <div id="buffer-spinner"><i class="bi bi-arrow-repeat"></i></div>

      <!-- center play/pause feedback -->
      <div id="center-indicator"><i class="bi bi-play-fill" id="center-icon"></i></div>

      <!-- 2× speed hold indicator -->
      <div id="speed-indicator">2× <i class="bi bi-fast-forward-fill"></i></div>

      <!-- keyboard shortcut help -->
      <div id="shortcuts-help">
        <div class="sh-card">
          <h3><i class="bi bi-keyboard"></i> Klávesové zkratky</h3>
          <dl>
            <dt><kbd>Mezerník</kbd> / <kbd>K</kbd></dt><dd>Přehrát / pozastavit</dd>
            <dt><kbd>←</kbd> / <kbd>→</kbd></dt><dd>Přetočit o 10 s</dd>
            <dt><kbd>↑</kbd> / <kbd>↓</kbd></dt><dd>Hlasitost</dd>
            <dt><kbd>M</kbd></dt><dd>Ztlumit</dd>
            <dt><kbd>F</kbd></dt><dd>Celá obrazovka</dd>
            <dt><kbd>Podržet</kbd></dt><dd>2× rychlost</dd>
            <dt><kbd>?</kbd></dt><dd>Tato nápověda</dd>
          </dl>
          <p class="sh-hint">Stiskněte <kbd>?</kbd> nebo <kbd>Esc</kbd> pro zavření</p>
        </div>
      </div>

      <!-- bottom controls -->
      <div class="player-controls">
        <div class="seek-row">
          <span class="time-label" id="time-current">0:00</span>
          <div class="seek-bar-wrap" id="seek-bar">
            <div id="seek-buffered" style="width:0%"></div>
            <div id="seek-filled" style="width:0%"></div>
          </div>
          <span class="time-label" id="time-total" style="cursor:pointer" title="Přepnout na zbývající čas">0:00</span>
        </div>

        <div class="controls-row">
          <div class="controls-left">
            <button class="ctrl-btn" id="skip-back-btn" title="−10 s" aria-label="Přetočit o 10 sekund zpět"><i class="bi bi-arrow-counterclockwise"></i></button>
            <button class="ctrl-btn" id="play-pause-btn" aria-label="Přehrát nebo pozastavit"><i class="bi bi-play-fill"></i></button>
            <button class="ctrl-btn" id="skip-fwd-btn" title="+10 s" aria-label="Přetočit o 10 sekund vpřed"><i class="bi bi-arrow-clockwise"></i></button>
            <div class="volume-wrap">
              <button class="ctrl-btn" id="mute-btn" aria-label="Ztlumit"><i class="bi bi-volume-up-fill"></i></button>
              <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" aria-label="Hlasitost" />
            </div>
          </div>
          <div class="controls-right">
            <div class="speed-wrap">
              <button class="ctrl-btn" id="speed-btn" aria-label="Rychlost přehrávání">1×</button>
              <div class="speed-menu" id="speed-menu">
                <div class="speed-option" data-speed="0.5">0.5×</div>
                <div class="speed-option active" data-speed="1">1×</div>
                <div class="speed-option" data-speed="1.25">1.25×</div>
                <div class="speed-option" data-speed="1.5">1.5×</div>
                <div class="speed-option" data-speed="2">2×</div>
              </div>
            </div>
            <button class="ctrl-btn" id="cc-btn" title="Titulky" aria-label="Titulky" style="display:none"><i class="bi bi-badge-cc"></i></button>
            <button class="ctrl-btn" id="pip-btn" title="Picture in Picture" aria-label="Obraz v obraze"><i class="bi bi-pip"></i></button>
            <button class="ctrl-btn" id="help-btn" title="Klávesové zkratky (?)" aria-label="Klávesové zkratky"><i class="bi bi-keyboard"></i></button>
            <button class="ctrl-btn" id="fullscreen-btn" aria-label="Celá obrazovka"><i class="bi bi-fullscreen"></i></button>
          </div>
        </div>
      </div>

    </div>

    <script>
      const video        = document.getElementById('video')
      const playerWrap   = document.getElementById('player-wrap')
      const loadingScreen = document.getElementById('loading-screen')
      const errorScreen  = document.getElementById('error-screen')
      const errorMsg     = document.getElementById('error-msg')
      const playerTitle  = document.getElementById('player-title')
      const playPauseBtn = document.getElementById('play-pause-btn')
      const muteBtn      = document.getElementById('mute-btn')
      const volumeSlider = document.getElementById('volume-slider')
      const fullscreenBtn= document.getElementById('fullscreen-btn')
      const seekBar      = document.getElementById('seek-bar')
      const seekFilled   = document.getElementById('seek-filled')
      const timeCurrent  = document.getElementById('time-current')
      const timeTotal    = document.getElementById('time-total')
      const centerIndicator = document.getElementById('center-indicator')
      const centerIcon   = document.getElementById('center-icon')
      const qualitySelector = document.getElementById('quality-selector')
      const qualityList  = document.getElementById('quality-list')
      const speedBtn     = document.getElementById('speed-btn')
      const speedMenu    = document.getElementById('speed-menu')
      const pipBtn       = document.getElementById('pip-btn')
      const skipBackBtn  = document.getElementById('skip-back-btn')
      const skipFwdBtn   = document.getElementById('skip-fwd-btn')
      const helpBtn      = document.getElementById('help-btn')
      const shortcutsHelp = document.getElementById('shortcuts-help')
      const seekBuffered = document.getElementById('seek-buffered')
      const speedIndicator = document.getElementById('speed-indicator')
      // Declared here (not lower) because startVideo() runs during initial load and
      // calls _renderSubtitles(), which references ccBtn — a lower `const` would TDZ-crash.
      const ccBtn        = document.getElementById('cc-btn')
      let showRemaining  = localStorage.getItem('filmbox_show_remaining') === '1'

      // ── Load data from sessionStorage ──
      function _profileId() {
        try {
          const r = sessionStorage.getItem('filmbox_active_profile')
          return r ? (JSON.parse(r).id || 'default') : 'default'
        } catch { return 'default' }
      }

      const raw = sessionStorage.getItem('filmbox_player')
      let _playerTmdbId = null
      let _playerMediaType = 'movie'
      let _playerData = null
      // Progress key: tmdbId for movies/whole shows, "tmdbId:S01E05" for episodes.
      let _playerKey = null

      if (!raw) {
        showError('Žádná data přehrávače. Vraťte se zpět a vyberte video.')
      } else {
        const data = JSON.parse(raw)
        _playerData = data
        playerTitle.textContent = data.title || 'FilmBox'
        document.title = (data.title || 'FilmBox') + ' — Player'
        _playerTmdbId    = data.tmdbId || null
        _playerMediaType = data.mediaType || 'movie'
        _playerKey       = data.progressKey || (data.tmdbId != null ? String(data.tmdbId) : null)

        if (data.tmdbId) {
          const _baseMeta = {
            id:          data.tmdbId,
            title:       data.title,
            media_type:  data.mediaType || 'movie',
            mediaType:   data.mediaType || 'movie',
            poster_path: data.posterPath || null
          }
          localStorage.setItem('filmbox_meta_' + (_playerKey || data.tmdbId), JSON.stringify(_baseMeta))
          // Upgrade with full TMDB details (rating, runtime, year) — non-blocking, never delays playback
          fetch(`/tmdb/details?id=${data.tmdbId}&type=${data.mediaType || 'movie'}`)
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (!d) return
              localStorage.setItem('filmbox_meta_' + (_playerKey || data.tmdbId), JSON.stringify({
                ..._baseMeta,
                poster_path:    data.posterPath || d.poster_path || null,
                vote_average:   d.vote_average,
                runtime:        d.runtime,
                release_date:   d.release_date,
                first_air_date: d.first_air_date,
                genre_ids:      Array.isArray(d.genres) ? d.genres.map(g => g.id) : undefined
              }))
            })
            .catch(() => {})
        }

        if (data.videos.length === 1) {
          startVideo(data.videos[0])
        } else {
          showQualityPicker(data.videos)
        }
      }

      // ── Restore volume from localStorage ──
      const savedVol = localStorage.getItem('filmbox_volume')
      if (savedVol !== null) {
        video.volume = parseFloat(savedVol)
        volumeSlider.value = video.volume
      }

      function showError(msg) {
        loadingScreen.style.display = 'none'
        errorMsg.textContent = msg
        errorScreen.style.display = 'flex'
      }

      function showQualityPicker(videos) {
        loadingScreen.style.display = 'none'
        playerWrap.style.display = 'block'
        qualitySelector.style.display = 'block'

        qualityList.innerHTML = ''   // avoid stacking duplicates if reopened
        videos.forEach((v, i) => {
          const item = document.createElement('div')
          item.className = 'quality-item'
          item.innerHTML = `
            <span>${v.name || 'Zdroj ' + (i + 1)}</span>
            <span>${v.duration || ''}</span>
          `
          item.addEventListener('click', () => {
            qualitySelector.style.display = 'none'
            startVideo(v)
          })
          qualityList.appendChild(item)
        })
      }

      function _renderSubtitles(subs) {
        // Remove any tracks from a previous source
        video.querySelectorAll('track').forEach(t => t.remove())
        const list = Array.isArray(subs) ? subs.filter(s => s && s.src) : []
        if (!list.length) { ccBtn.style.display = 'none'; return }
        list.forEach((s, i) => {
          const tr = document.createElement('track')
          tr.kind = 'subtitles'
          tr.label = s.label || ('Titulky ' + (i + 1))
          if (s.lang) tr.srclang = s.lang
          // Proxy through the server so cross-origin .vtt/.srt loads (and SRT converts)
          tr.src = `/get_subtitle?url=${encodeURIComponent(s.src)}`
          video.appendChild(tr)
        })
        ccBtn.style.display = ''
      }
      // CC toggles the first text track on/off.
      let _ccOn = false
      ccBtn.addEventListener('click', () => {
        const tracks = video.textTracks
        if (!tracks.length) return
        _ccOn = !_ccOn
        for (let i = 0; i < tracks.length; i++) tracks[i].mode = (i === 0 && _ccOn) ? 'showing' : 'hidden'
        ccBtn.classList.toggle('active', _ccOn)
      })

      function startVideo(v) {
        loadingScreen.style.display = 'none'
        playerWrap.style.display = 'block'
        video.src = v.videoSrc
        _renderSubtitles(v.subtitles)
        video.play().catch(() => {})
      }

      // ── Format time ──
      function fmt(s) {
        if (isNaN(s)) return '0:00'
        const h = Math.floor(s / 3600)
        const m = Math.floor((s % 3600) / 60)
        const sec = Math.floor(s % 60)
        if (h >= 1) return `${h}:${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`
        return `${m}:${sec.toString().padStart(2, '0')}`
      }

      // ── Skip ±10s ──
      function skip(delta) {
        if (isNaN(video.duration)) return
        video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + delta))
      }
      skipBackBtn.addEventListener('click', () => skip(-10))
      skipFwdBtn.addEventListener('click', () => skip(10))

      // ── Total-time label: full duration or remaining countdown ──
      function updateTotalLabel() {
        if (isNaN(video.duration)) { timeTotal.textContent = '0:00'; return }
        timeTotal.textContent = showRemaining
          ? '-' + fmt(Math.max(0, video.duration - video.currentTime))
          : fmt(video.duration)
      }
      timeTotal.addEventListener('click', () => {
        showRemaining = !showRemaining
        localStorage.setItem('filmbox_show_remaining', showRemaining ? '1' : '0')
        updateTotalLabel()
      })

      // ── Buffered indicator ──
      function updateBuffered() {
        if (!video.duration || !video.buffered.length) return
        const end = video.buffered.end(video.buffered.length - 1)
        seekBuffered.style.width = Math.min(100, (end / video.duration) * 100) + '%'
      }
      video.addEventListener('progress', updateBuffered)

      // ── Resume prompt ──
      // Instead of silently jumping to the saved spot, offer "resume / start over".
      function _showResumePrompt(saved) {
        const ov = document.createElement('div')
        ov.className = 'resume-prompt'
        ov.innerHTML = `
          <div class="resume-card">
            <p>Pokračovat od <strong>${fmt(saved)}</strong>?</p>
            <div class="resume-actions">
              <button class="resume-yes"><i class="bi bi-play-fill"></i> Pokračovat</button>
              <button class="resume-no">Od začátku</button>
            </div>
          </div>`
        playerWrap.appendChild(ov)
        let _settled = false
        const resume = () => { if (_settled) return; _settled = true; video.currentTime = saved; ov.remove(); video.play().catch(() => {}) }
        const restart = () => { if (_settled) return; _settled = true; ov.remove(); video.play().catch(() => {}) }
        ov.querySelector('.resume-yes').addEventListener('click', resume)
        ov.querySelector('.resume-no').addEventListener('click', restart)
        // Default to resuming if the viewer doesn't choose within 8s.
        setTimeout(resume, 8000)
        video.pause()
      }

      // ── Video events ──
      video.addEventListener('loadedmetadata', async () => {
        updateTotalLabel()
        // Restore saved progress from server
        const pid = _profileId()
        if (_playerKey && pid !== 'default') {
          try {
            const res = await fetch(`/api/profiles/${pid}/progress`)
            if (res.ok) {
              const map = await res.json()
              const val  = map[_playerKey]
              const saved = (val && typeof val === 'object') ? val.seconds : parseFloat(val)
              if (saved && saved > 0 && saved < video.duration - 5) {
                _showResumePrompt(saved)
              }
            }
          } catch {}
        }
      })

      // Full progress payload: position + display metadata so Continue Watching
      // can render server-side without depending on this browser's localStorage.
      function _progressBody() {
        const d = _playerData || {}
        return {
          seconds:      video.currentTime,
          duration:     isFinite(video.duration) ? video.duration : null,
          title:        d.title || null,
          posterPath:   d.posterPath || null,
          mediaType:    d.mediaType || 'movie',
          tmdbId:       d.tmdbId != null ? d.tmdbId : null,
          episodeLabel: d.episodeLabel || null
        }
      }

      function _saveProgressToApi() {
        const pid = _profileId()
        if (!_playerKey || pid === 'default' || !video.currentTime) return
        fetch(`/api/profiles/${pid}/progress/${encodeURIComponent(_playerKey)}`, {
          method:  'PUT',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(_progressBody())
        }).catch(() => {})
      }

      // Persist progress to the JSON store once a minute while playing.
      // (A debounced timeupdate timer never fired during continuous playback
      //  because timeupdate kept resetting it, so progress was rarely saved.)
      let _progressSaveInterval = null
      function _startProgressSaver() {
        if (_progressSaveInterval) return
        _progressSaveInterval = setInterval(() => {
          if (!video.paused) _saveProgressToApi()
        }, 60000)
      }
      function _stopProgressSaver() {
        clearInterval(_progressSaveInterval)
        _progressSaveInterval = null
      }
      video.addEventListener('play',  _startProgressSaver)
      video.addEventListener('pause', () => { _stopProgressSaver(); _saveProgressToApi() })
      video.addEventListener('ended', _stopProgressSaver)

      let _watchedFired = false
      video.addEventListener('timeupdate', () => {
        if (!video.duration) return
        const pct = (video.currentTime / video.duration) * 100
        seekFilled.style.width = pct + '%'
        timeCurrent.textContent = fmt(video.currentTime)
        if (showRemaining) updateTotalLabel()
        updateBuffered()
        // Auto-mark watched at 90%
        if (!_watchedFired && video.currentTime / video.duration >= 0.9) {
          _watchedFired = true
          const _raw = sessionStorage.getItem('filmbox_player')
          if (_raw) {
            const _d  = JSON.parse(_raw)
            const pid = _profileId()
            if (_d.tmdbId && pid !== 'default') {
              fetch(`/api/profiles/${pid}/watched`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({
                  tmdbId:    _d.tmdbId,
                  mediaType: _d.mediaType || 'movie',
                  title:     _d.title,
                  posterPath: _d.posterPath || null
                })
              }).catch(() => {})
              // Finished → drop the progress entry so it leaves Continue Watching.
              if (_playerKey) {
                fetch(`/api/profiles/${pid}/progress/${encodeURIComponent(_playerKey)}`, { method: 'DELETE' }).catch(() => {})
              }
            }
          }
        }
      })

      video.addEventListener('play', () => {
        playPauseBtn.innerHTML = '<i class="bi bi-pause-fill"></i>'
      })

      video.addEventListener('pause', () => {
        playPauseBtn.innerHTML = '<i class="bi bi-play-fill"></i>'
      })

      video.addEventListener('ended', () => {
        playPauseBtn.innerHTML = '<i class="bi bi-arrow-counterclockwise"></i>'
        _hideSpinner()
        if (_playerData && _playerData.episode) _showNextEpisodePrompt()
      })

      video.addEventListener('error', () => {
        showError('Video se nepodařilo načíst. Zkuste jiný zdroj.')
      })

      // ── Buffering spinner ──
      const bufferSpinner = document.getElementById('buffer-spinner')
      const _showSpinner = () => bufferSpinner.classList.add('show')
      const _hideSpinner = () => bufferSpinner.classList.remove('show')
      video.addEventListener('waiting',  _showSpinner)
      video.addEventListener('seeking',  _showSpinner)
      video.addEventListener('playing',  _hideSpinner)
      video.addEventListener('canplay',  _hideSpinner)
      video.addEventListener('seeked',   _hideSpinner)

      // ── Auto-play next episode (TV only) ──
      async function _playNextEpisode() {
        const d = _playerData
        if (!d || !d.episode || !d.tmdbId) return false
        const nextNum = d.episode.number + 1
        const sNum = String(d.episode.season).padStart(2, '0')
        const eNum = String(nextNum).padStart(2, '0')
        const base = (d.title || '').replace(/\s*S\d{2}E\d{2}.*$/i, '').trim()
        const query = `${base} S${sNum}E${eNum}`
        try {
          const r = await fetch(`/search?q=${encodeURIComponent(query)}`)
          if (!r.ok) return false
          const results = await r.json()
          if (!results.length) return false
          // results are HTML card strings — extract the first playable href.
          const doc  = new DOMParser().parseFromString(results.join(''), 'text/html')
          const href = doc.querySelector('a[href]')?.getAttribute('href')
          if (!href) return false
          const vr = await fetch(`/get_video?url=${encodeURIComponent(href)}`)
          if (!vr.ok) return false
          const videos = (await vr.json()).filter(v => v.videoSrc && !v.videoSrc.startsWith('blob:'))
          if (!videos.length) return false
          sessionStorage.setItem('filmbox_player', JSON.stringify({
            title:       query,
            videos,
            tmdbId:      d.tmdbId,
            mediaType:   'tv',
            posterPath:  d.posterPath || null,
            episode:     { season: d.episode.season, number: nextNum },
            episodeLabel: `S${sNum}E${eNum}`,
            progressKey: `${d.tmdbId}:S${sNum}E${eNum}`
          }))
          window.location.reload()
          return true
        } catch { return false }
      }

      function _showNextEpisodePrompt() {
        const d = _playerData
        if (!d || !d.episode) return
        const ov = document.createElement('div')
        ov.className = 'next-ep-prompt'
        ov.innerHTML = `
          <div class="next-ep-card">
            <p>Epizoda skončila</p>
            <div class="next-ep-actions">
              <button class="next-ep-yes"><i class="bi bi-skip-end-fill"></i> Další epizoda <span class="next-ep-count">(10)</span></button>
              <button class="next-ep-no">Zavřít</button>
            </div>
          </div>`
        playerWrap.appendChild(ov)
        let n = 10, done = false
        const go = async () => { if (done) return; done = true; clearInterval(t); const ok = await _playNextEpisode(); if (!ok) ov.querySelector('p').textContent = 'Další epizoda nenalezena' }
        const t = setInterval(() => {
          n--
          const c = ov.querySelector('.next-ep-count'); if (c) c.textContent = `(${n})`
          if (n <= 0) go()
        }, 1000)
        ov.querySelector('.next-ep-yes').addEventListener('click', go)
        ov.querySelector('.next-ep-no').addEventListener('click', () => { done = true; clearInterval(t); ov.remove() })
      }

      // ── Play / Pause ──
      function togglePlay() {
        if (video.ended) {
          video.currentTime = 0
          video.play()
          return
        }
        if (video.paused) {
          video.play()
          centerIcon.className = 'bi bi-play-fill'
        } else {
          video.pause()
          centerIcon.className = 'bi bi-pause-fill'
        }
        centerIndicator.classList.add('show')
        clearTimeout(centerIndicator._t)
        centerIndicator._t = setTimeout(() => centerIndicator.classList.remove('show'), 600)
      }

      playPauseBtn.addEventListener('click', () => {
        if (suppressClick) { suppressClick = false; return }
        togglePlay()
      })
      video.addEventListener('click', () => {
        if (suppressClick) { suppressClick = false; return }
        togglePlay()
      })

      // ── Hold anywhere on the video for 2× playback (release to restore) ──
      let holdTimer = null
      let holdActive = false
      let suppressClick = false
      let _prevRate = 1
      function startHold() {
        holdTimer = setTimeout(() => {
          holdActive = true
          _prevRate = video.playbackRate
          video.playbackRate = 2
          speedIndicator.classList.add('show')
        }, 350)
      }
      function endHold() {
        clearTimeout(holdTimer)
        if (holdActive) {
          video.playbackRate = _prevRate
          speedIndicator.classList.remove('show')
          holdActive = false
          suppressClick = true
        }
      }
      video.addEventListener('mousedown', startHold)
      video.addEventListener('touchstart', startHold, { passive: true })
      video.addEventListener('mouseup', endHold)
      video.addEventListener('mouseleave', endHold)
      video.addEventListener('touchend', endHold)
      video.addEventListener('touchcancel', endHold)

      // ── Seek ──
      let seeking = false

      function applySek(e) {
        if (!video.duration || !isFinite(video.duration)) return
        const rect = seekBar.getBoundingClientRect()
        if (!rect.width) return
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width))
        video.currentTime = pct * video.duration
      }

      seekBar.addEventListener('mousedown', e => { seeking = true; applySek(e) })
      document.addEventListener('mousemove', e => { if (seeking) applySek(e) })
      document.addEventListener('mouseup', () => { seeking = false })

      // ── Volume ──
      volumeSlider.addEventListener('input', () => {
        video.volume = volumeSlider.value
        video.muted = video.volume === 0
        localStorage.setItem('filmbox_volume', video.volume)
        updateMuteIcon()
      })

      muteBtn.addEventListener('click', () => {
        video.muted = !video.muted
        volumeSlider.value = video.muted ? 0 : video.volume
        updateMuteIcon()
      })

      function updateMuteIcon() {
        const v = video.muted || video.volume === 0
        muteBtn.innerHTML = v
          ? '<i class="bi bi-volume-mute-fill"></i>'
          : '<i class="bi bi-volume-up-fill"></i>'
      }

      // ── Fullscreen ──
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          playerWrap.requestFullscreen()
          fullscreenBtn.innerHTML = '<i class="bi bi-fullscreen-exit"></i>'
        } else {
          document.exitFullscreen()
          fullscreenBtn.innerHTML = '<i class="bi bi-fullscreen"></i>'
        }
      })

      // ── Playback speed ──
      speedBtn.addEventListener('click', e => {
        e.stopPropagation()
        speedMenu.classList.toggle('open')
      })

      speedMenu.querySelectorAll('.speed-option').forEach(opt => {
        opt.addEventListener('click', () => {
          const speed = parseFloat(opt.dataset.speed)
          video.playbackRate = speed
          speedBtn.textContent = speed === 1 ? '1×' : speed + '×'
          speedMenu.querySelectorAll('.speed-option').forEach(o => o.classList.remove('active'))
          opt.classList.add('active')
          speedMenu.classList.remove('open')
        })
      })

      document.addEventListener('click', e => {
        if (!e.target.closest('.speed-wrap')) speedMenu.classList.remove('open')
      })

      // ── Picture in Picture ──
      if (document.pictureInPictureEnabled) {
        pipBtn.addEventListener('click', async () => {
          if (document.pictureInPictureElement) {
            await document.exitPictureInPicture()
          } else {
            await video.requestPictureInPicture()
          }
        })
      } else {
        pipBtn.style.display = 'none'
      }

      // ── Keyboard shortcut help overlay ──
      function toggleHelp(force) {
        const show = force != null ? force : !shortcutsHelp.classList.contains('show')
        shortcutsHelp.classList.toggle('show', show)
      }
      helpBtn.addEventListener('click', () => toggleHelp())
      shortcutsHelp.addEventListener('click', e => { if (e.target === shortcutsHelp) toggleHelp(false) })

      // ── Keyboard shortcuts ──
      document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return
        if (e.key === '?') { e.preventDefault(); toggleHelp(); return }
        if (e.key === 'Escape' && shortcutsHelp.classList.contains('show')) { toggleHelp(false); return }
        if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay() }
        if (e.key === 'ArrowRight') skip(10)
        if (e.key === 'ArrowLeft')  skip(-10)
        if (e.key === 'ArrowUp')    { video.volume = Math.min(1, video.volume + 0.1); volumeSlider.value = video.volume; updateMuteIcon() }
        if (e.key === 'ArrowDown')  { video.volume = Math.max(0, video.volume - 0.1); volumeSlider.value = video.volume; updateMuteIcon() }
        if (e.key === 'f') fullscreenBtn.click()
        if (e.key === 'm') muteBtn.click()
      })

      // ── Auto-hide controls ──
      let hideTimeout
      function showControls() {
        playerWrap.classList.add('controls-visible')
        clearTimeout(hideTimeout)
        hideTimeout = setTimeout(() => {
          if (!video.paused) playerWrap.classList.remove('controls-visible')
        }, 3000)
      }

      playerWrap.addEventListener('mousemove', showControls)
      playerWrap.addEventListener('mouseenter', showControls)

      video.addEventListener('pause', () => {
        playerWrap.classList.add('controls-visible')
        clearTimeout(hideTimeout)
      })

      window.addEventListener('pagehide', () => {
        const pid = _profileId()
        if (_playerKey && pid !== 'default' && video.currentTime > 5) {
          const url  = `/api/profiles/${pid}/progress/${encodeURIComponent(_playerKey)}`
          const body = JSON.stringify(_progressBody())
          navigator.sendBeacon
            ? navigator.sendBeacon(url, new Blob([body], { type: 'application/json' }))
            : fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body }).catch(() => {})
        }
      })
    </script>
  </body>
</html>
